# Supabase CLI configuration for the FaidaHQ Hospitality Assistant.
# Run `supabase link --project-ref <your-ref>` to connect this folder to your project.
project_id = "faidahq"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
site_url = "https://faidahq.com"
additional_redirect_urls = ["https://faidahq.com/dashboard/", "http://localhost:8080/dashboard/"]

# The widget endpoints are public (website visitors are not signed in).
# They do their own validation, business scoping and rate limiting.
[functions.widget]
verify_jwt = false

[functions.chat]
verify_jwt = false

[functions.enquiry]
verify_jwt = false

# Admin-only: needs a signed-in user, and the function itself checks that the
# user is a FaidaHQ platform admin before touching any AI key.
[functions.admin-ai-keys]
verify_jwt = true

# Signed-in owners/admins trigger it from the dashboard; the scheduled run uses
# the LEARN_CRON_SECRET header instead of a user token, so JWT checking is off
# and the function authenticates both callers itself.
[functions.learn]
verify_jwt = false
