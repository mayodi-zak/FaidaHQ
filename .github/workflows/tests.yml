name: Tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  functions-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI database: local trust auth, no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function tests
        run: deno test --allow-env tests/functions
      - name: Database security tests
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: bash tests/db/run.sh
